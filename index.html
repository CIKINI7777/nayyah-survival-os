<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NAYYAH - Survival OS</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/nayyah-hud.css">
    <meta name="theme-color" content="#000000">
</head>
<body class="survival-mode">
    <!-- HANYA ADA INI DI LAYAR UTAMA -->
    <div id="hud-container">
        <div id="status-bar">🟢 SISTEM SIAGA | BATERAI: <span id="battery-level">--</span>%</div>
        
        <div id="compass-ring">
            <div id="direction-arrow"></div>
            <div id="distance-label">0m ke Titik Kumpul</div>
        </div>

        <div id="action-buttons">
            <button id="btn-scan-qr" aria-label="Scan Landmark">📷 SCAN</button>
            <button id="btn-flashlight" aria-label="Senter Darurat">🔦</button>
            <button id="btn-mesh-chat" aria-label="Chat Mesh">💬 MESH</button>
        </div>

        <div id="voice-indicator">🔊 Menunggu perintah...</div>
    </div>

    <script src="js/core.js"></script>
    <script src="/js/navigator.js"></script>
    <script src="js/mesh.js"></script>
    <script src="js/audio.js"></script>
</body>
</html>
